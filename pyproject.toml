[project]
name = "toolmeta_harvester"
version = "1.1.0-alpha.3"
description = "Metadata harvesting and enrichment framework for the EOSC Data Commons Tool Registry, integrating software and workflow metadata from distributed sources through Apache Airflow pipelines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dynaconf>=3.2.12",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.2",
    "pygithub>=2.8.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "requests-cache>=1.2.1",
    "sqlalchemy>=2.0.45",
    "transformers>=5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolmeta_harvester"]

[tool.deptry]
known_first_party = ["toolmeta_harvester"]

[tool.deptry.package_module_name_map]
beautifulsoup4 = ["bs4"]
pyyaml = ["yaml"]
pygithub = ["github"]
